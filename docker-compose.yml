services:
  mysql:
    image: mysql:8.0
    container_name: aitrader-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: campusmall
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M --max-connections=50
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ai-trader-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./ai-trader-backend/src/main/resources/schema-phase2.sql:/docker-entrypoint-initdb.d/02-schema-phase2.sql
      - ./ai-trader-backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/03-data.sql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    container_name: aitrader-redis
    restart: unless-stopped
    command: redis-stack-server --requirepass ${REDIS_PASSWORD:-123456} --maxmemory 512mb
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:8011:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./ai-trader-backend
      dockerfile: Dockerfile
    container_name: aitrader-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: campusmall
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-your-very-long-and-secure-secret-key-here-with-at-least-32-charact}
      AI_API_KEY: ${AI_API_KEY:-your_dashscope_api_key_here}
      AI_MODEL: ${AI_MODEL:-qwen3-max}
      AI_AGENT_HOST: ai-agent
      AI_AGENT_PORT: 8000
      PROXY_ENABLE: "false"
      RESEND_API_KEY: ${RESEND_API_KEY:-your_resend_api_key_here}
    volumes:
      - upload_data:/app/upload
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-agent:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: aitrader-agent
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-your_dashscope_api_key_here}
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-deepseek-v4-flash}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_DB: 0
      JAVA_BACKEND_URL: http://backend:8080
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./AiTrader
      dockerfile: Dockerfile
    container_name: aitrader-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  upload_data:
