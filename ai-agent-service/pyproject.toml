[project]
name = "ai-agent-service"
version = "0.1.0"
description = "AiTrader LangGraph Agent Service"
requires-python = ">=3.11"
dependencies = [
    # --- 运行时核心（已在本机实测通过，版本精确锁定） ---
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-openai==1.6.0",
    "openai==3.8.0",
    # --- 数据 / 工具 ---
    "redis==8.1.0",
    "httpx>=0.26.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    # --- 配置 ---
    "pydantic==2.13.4",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # --- 观测 ---
    "langfuse>=3.0.0",
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# 默认排除评测集（需 DashScope embedding / LLM 等外部依赖）；
# 显式运行：uv run pytest -m evals
addopts = ["-m", "not evals and not mcp", "--strict-markers"]
markers = [
    "evals: Stage4 评测集（默认排除；需外部 embedding/LLM 依赖）",
    "offline: 离线检索指标 recall@k/MRR（仅需 embedding，最扎实基线）",
    "judge: LLM-as-judge 端到端忠实度评测",
    "format: 策略报告格式合规评测",
    "mcp: Stage5 MCP stdio 客户端集成验证（默认排除；需 Binance 行情网络）",
]
